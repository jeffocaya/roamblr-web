<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveler Dashboard · roamblr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#fbfaf8]">

    <!-- Simple Mobile Header -->
    <div class="bg-white border-b border-[#eae7e2] px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <a href="/roamblr-web/index.html" class="text-xl font-bold">
                roam<span class="text-[#c4511c]">blr</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/roamblr-web/directory.html" class="text-[#c4511c] text-sm">
                    <i class="fas fa-search"></i>
                </a>
                <button id="logoutBtn" class="border border-[#151515] text-[#151515] px-3 py-1.5 rounded-full text-xs">
                    Exit
                </button>
            </div>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold">Your Trips</h1>
            <p class="text-[#5a5a5a] text-sm mt-1">Track your collaboration requests</p>
        </div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6]">
                <div class="text-2xl font-bold text-[#c4511c]" id="stat-pending">0</div>
                <div class="text-xs text-[#6f6f6f]">Pending</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6]">
                <div class="text-2xl font-bold text-[#c4511c]" id="stat-accepted">0</div>
                <div class="text-xs text-[#6f6f6f]">Accepted</div>
            </div>
        </div>

        <!-- Requests List -->
        <div id="requests-list" class="space-y-3">
            <!-- Loaded by JS -->
        </div>
    </div>

    <script type="module">
        import { auth, db, logout, getCurrentUser, requireAuth } from '/roamblr-web/js/auth.js';
        import { collection, query, where, getDocs, doc, getDoc } from '/roamblr-web/js/firebase.js';

        requireAuth();

        async function loadTravelerData() {
            const user = await getCurrentUser();
            if (!user) return;

            // Load requests
            const requestsQuery = query(
                collection(db, "requests"),
                where("travelerId", "==", user.uid)
            );
            const requestsSnapshot = await getDocs(requestsQuery);
            const requests = requestsSnapshot.docs;
            
            // Update stats
            const pending = requests.filter(d => d.data().status === 'pending').length;
            const accepted = requests.filter(d => d.data().status === 'accepted').length;
            
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-accepted').textContent = accepted;

            const requestsList = document.getElementById('requests-list');
            
            if (requests.length === 0) {
                requestsList.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-[#eeebe6] text-center">
                        <div class="w-16 h-16 bg-[#f2ede7] rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-map-pin text-2xl text-[#c4511c]"></i>
                        </div>
                        <p class="text-[#5a5a5a] text-sm mb-3">No requests yet</p>
                        <a href="/roamblr-web/directory.html" class="inline-block bg-[#c4511c] text-white px-6 py-2 rounded-full text-sm">
                            Browse Cities
                        </a>
                    </div>
                `;
            } else {
                const requestsHtml = await Promise.all(requests.map(async (doc) => {
                    const data = doc.data();
                    const creatorDoc = await getDoc(doc(db, "creators", data.creatorId));
                    const creator = creatorDoc.exists() ? creatorDoc.data() : { name: 'Unknown' };
                    
                    const statusColors = {
                        pending: 'bg-yellow-100 text-yellow-800',
                        accepted: 'bg-green-100 text-green-800',
                        rejected: 'bg-red-100 text-red-800',
                        completed: 'bg-blue-100 text-blue-800'
                    };
                    
                    return `
                        <div class="bg-white p-4 rounded-xl border border-[#eeebe6]">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-semibold">${creator.name}</h3>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[data.status]}">
                                    ${data.status}
                                </span>
                            </div>
                            <p class="text-xs text-[#c4511c] mb-2">
                                <i class="far fa-calendar mr-1"></i> ${data.arrivalDate} to ${data.departureDate}
                            </p>
                            <p class="text-sm text-[#5a5a5a]">"${data.contentIdea}"</p>
                            
                            ${data.status === 'accepted' ? `
                                <div class="mt-3 p-3 bg-green-50 rounded-lg">
                                    <p class="text-xs text-green-700">
                                        <i class="fas fa-check-circle mr-1"></i> 
                                        Request accepted! They'll contact you soon.
                                    </p>
                                </div>
                            ` : ''}
                            
                            <a href="/roamblr-web/creator.html?id=${data.creatorId}" class="mt-3 text-xs text-[#c4511c] inline-block">
                                View Profile →
                            </a>
                        </div>
                    `;
                }));
                
                requestsList.innerHTML = requestsHtml.join('');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadTravelerData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Dashboard · roamblr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#fbfaf8]">

    <!-- Simple Mobile Header -->
    <div class="bg-white border-b border-[#eae7e2] px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <a href="/roamblr-web/index.html" class="text-xl font-bold">
                roam<span class="text-[#c4511c]">blr</span>
            </a>
            <div class="flex items-center gap-3">
                <a href="/roamblr-web/directory.html" class="text-[#c4511c] text-sm">
                    <i class="fas fa-search"></i>
                </a>
                <button id="logoutBtn" class="border border-[#151515] text-[#151515] px-3 py-1.5 rounded-full text-xs">
                    Exit
                </button>
            </div>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold">Your Dashboard</h1>
            <p class="text-[#5a5a5a] text-sm mt-1">Manage your requests and profile</p>
        </div>

        <!-- Status Card -->
        <div id="statusBanner" class="mb-4 p-4 rounded-xl text-sm hidden"></div>

        <!-- Quick Stats -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="bg-white p-3 rounded-xl border border-[#eeebe6] text-center">
                <div class="text-xl font-bold text-[#c4511c]" id="stat-requests">0</div>
                <div class="text-xs text-[#6f6f6f]">Requests</div>
            </div>
            <div class="bg-white p-3 rounded-xl border border-[#eeebe6] text-center">
                <div class="text-xl font-bold text-[#c4511c]" id="stat-collabs">0</div>
                <div class="text-xs text-[#6f6f6f]">Collabs</div>
            </div>
            <div class="bg-white p-3 rounded-xl border border-[#eeebe6] text-center">
                <div class="text-xl font-bold text-[#c4511c]" id="stat-views">-</div>
                <div class="text-xs text-[#6f6f6f]">Response</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-[#eae7e2] mb-4">
            <button onclick="switchTab('requests')" class="tab-btn active flex-1 py-3 text-sm font-medium border-b-2 border-[#c4511c] text-[#c4511c]" id="tab-requests">
                Requests
            </button>
            <button onclick="switchTab('profile')" class="tab-btn flex-1 py-3 text-sm font-medium text-[#6f6f6f]" id="tab-profile">
                Profile
            </button>
        </div>

        <!-- Requests Tab -->
        <div id="requests-tab" class="tab-content">
            <div id="requests-list" class="space-y-3">
                <!-- Loaded by JS -->
            </div>
        </div>

        <!-- Profile Tab -->
        <div id="profile-tab" class="tab-content hidden">
            <div id="profile-info" class="space-y-4">
                <!-- Loaded by JS -->
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, logout, getCurrentUser, requireAuth } from '/roamblr-web/js/auth.js';
        import { collection, query, where, getDocs, doc, getDoc, updateDoc } from '/roamblr-web/js/firebase.js';

        requireAuth();

        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-[#c4511c]', 'text-[#c4511c]');
                btn.classList.add('text-[#6f6f6f]');
            });
            document.getElementById(`tab-${tabName}`).classList.add('border-[#c4511c]', 'text-[#c4511c]');
        };

        async function loadLocalData() {
            const user = await getCurrentUser();
            if (!user) return;

            // Check if creator profile exists
            const creatorDoc = await getDoc(doc(db, "creators", user.uid));
            
            if (!creatorDoc.exists()) {
                window.location.href = '/roamblr-web/dashboard/local/setup.html';
                return;
            }

            const creator = creatorDoc.data();
            
            // Load requests
            const requestsQuery = query(
                collection(db, "requests"),
                where("creatorId", "==", user.uid)
            );
            const requestsSnapshot = await getDocs(requestsQuery);
            const requests = requestsSnapshot.docs;
            
            const pendingCount = requests.filter(d => d.data().status === 'pending').length;
            const acceptedCount = requests.filter(d => d.data().status === 'accepted').length;
            
            // Update stats
            document.getElementById('stat-requests').textContent = pendingCount;
            document.getElementById('stat-collabs').textContent = creator.hosted || 0;
            document.getElementById('stat-views').textContent = creator.responseTime || 'fast';
            
            // Show status banner
            const banner = document.getElementById('statusBanner');
            if (creator.status === 'pending') {
                banner.classList.remove('hidden');
                banner.className = 'mb-4 p-4 rounded-xl bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm';
                banner.innerHTML = '<i class="fas fa-clock mr-2"></i> Your profile is pending review.';
            } else if (creator.status === 'approved') {
                banner.classList.remove('hidden');
                banner.className = 'mb-4 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm';
                banner.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Your profile is live!';
            }

            // Load requests list
            const requestsList = document.getElementById('requests-list');
            
            if (requests.length === 0) {
                requestsList.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-[#eeebe6] text-center">
                        <div class="w-16 h-16 bg-[#f2ede7] rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-inbox text-2xl text-[#c4511c]"></i>
                        </div>
                        <p class="text-[#5a5a5a] text-sm">No requests yet</p>
                    </div>
                `;
            } else {
                requestsList.innerHTML = requests.map(doc => {
                    const data = doc.data();
                    const statusColors = {
                        pending: 'bg-yellow-100 text-yellow-800',
                        accepted: 'bg-green-100 text-green-800',
                        rejected: 'bg-red-100 text-red-800',
                        completed: 'bg-blue-100 text-blue-800'
                    };
                    
                    return `
                        <div class="bg-white p-4 rounded-xl border border-[#eeebe6]">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-semibold">${data.travelerName}</h3>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[data.status]}">
                                    ${data.status}
                                </span>
                            </div>
                            <p class="text-xs text-[#c4511c] mb-2">
                                <i class="far fa-calendar mr-1"></i> ${data.arrivalDate} to ${data.departureDate}
                            </p>
                            <p class="text-sm text-[#5a5a5a] mb-3">"${data.contentIdea}"</p>
                            
                            ${data.status === 'pending' ? `
                                <div class="flex gap-2 mt-2">
                                    <button onclick="updateRequest('${doc.id}', 'accepted')" class="flex-1 bg-green-600 text-white py-2 rounded-full text-sm">
                                        Accept
                                    </button>
                                    <button onclick="updateRequest('${doc.id}', 'rejected')" class="flex-1 border border-red-600 text-red-600 py-2 rounded-full text-sm">
                                        Decline
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }

            // Profile tab content
            document.getElementById('profile-info').innerHTML = `
                <div class="bg-white p-5 rounded-xl border border-[#eeebe6]">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-16 h-16 bg-[#e6ddd2] rounded-full flex items-center justify-center text-3xl">
                            ${creator.avatar || '👤'}
                        </div>
                        <div>
                            <h3 class="font-bold">${creator.name}</h3>
                            <p class="text-sm text-[#c4511c]">${creator.city}</p>
                        </div>
                    </div>
                    
                    <div class="space-y-3 text-sm">
                        <p><span class="font-medium">Subscribers:</span> ${creator.subs}</p>
                        <p><span class="font-medium">Niches:</span> ${creator.niches?.join(', ') || 'Not specified'}</p>
                        <p><span class="font-medium">Bio:</span> ${creator.bio || 'No bio'}</p>
                        
                        <div class="pt-2 space-y-2">
                            <a href="${creator.channelLink}" target="_blank" class="block text-[#c4511c]">
                                <i class="fab fa-youtube mr-1"></i> YouTube Channel
                            </a>
                            <a href="/roamblr-web/creator.html?id=${user.uid}" class="block text-[#c4511c]">
                                <i class="fas fa-user mr-1"></i> View Public Profile
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.updateRequest = async (requestId, status) => {
            await updateDoc(doc(db, "requests", requestId), { status });
            loadLocalData();
        };

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadLocalData();
    </script>
</body>
</html>

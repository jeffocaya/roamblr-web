<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Dashboard · roamblr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#fbfaf8] pb-24">

    <!-- Simple Mobile Header -->
    <div class="bg-white border-b border-[#eae7e2] px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between">
            <a href="/roamblr-web/index.html" class="text-xl font-bold">
                roam<span class="text-[#c4511c]">blr</span>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="window.location.reload()" class="text-[#6f6f6f] text-sm">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="logoutBtn" class="border border-[#151515] text-[#151515] px-3 py-1.5 rounded-full text-xs">
                    Exit
                </button>
            </div>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Welcome Header with Greeting -->
        <div class="mb-6 slide-up">
            <p class="text-sm text-[#6f6f6f]">Welcome back,</p>
            <h1 class="text-2xl font-bold" id="welcome-name">Creator</h1>
            <p class="text-xs text-[#6f6f6f] mt-1" id="member-since">Member since 2024</p>
        </div>

        <!-- Quick Actions Row -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
            <a href="/roamblr-web/directory.html" class="bg-white shadow-sm rounded-full px-4 py-2 text-sm font-medium flex items-center gap-2 whitespace-nowrap border border-[#eeebe6]">
                <i class="fas fa-search text-[#c4511c]"></i>
                Browse
            </a>
            <a href="/roamblr-web/dashboard/local/setup.html" class="bg-white shadow-sm rounded-full px-4 py-2 text-sm font-medium flex items-center gap-2 whitespace-nowrap border border-[#eeebe6]">
                <i class="fas fa-edit text-[#c4511c]"></i>
                Edit Profile
            </a>
            <button onclick="shareProfile()" class="bg-white shadow-sm rounded-full px-4 py-2 text-sm font-medium flex items-center gap-2 whitespace-nowrap border border-[#eeebe6]">
                <i class="fas fa-share-alt text-[#c4511c]"></i>
                Share
            </button>
        </div>

        <!-- Status Card -->
        <div id="statusBanner" class="mb-4 p-4 rounded-xl text-sm hidden slide-up"></div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] text-center shadow-sm">
                <div class="text-2xl font-bold text-[#c4511c]" id="stat-pending">0</div>
                <div class="text-xs text-[#6f6f6f]">Pending</div>
                <div class="text-[10px] text-yellow-600 mt-1" id="pending-timer"></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] text-center shadow-sm">
                <div class="text-2xl font-bold text-[#c4511c]" id="stat-accepted">0</div>
                <div class="text-xs text-[#6f6f6f]">Accepted</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] text-center shadow-sm">
                <div class="text-2xl font-bold text-[#c4511c]" id="stat-total">0</div>
                <div class="text-xs text-[#6f6f6f]">Total</div>
            </div>
        </div>

        <!-- Profile Strength Meter (New) -->
        <div id="strength-meter" class="bg-white p-4 rounded-xl border border-[#eeebe6] mb-6 hidden slide-up">
            <div class="flex justify-between items-center mb-2">
                <span class="font-semibold text-sm">Profile Strength</span>
                <span class="text-sm font-bold" id="strength-percent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2 mb-3">
                <div id="strength-bar" class="bg-green-500 h-2 rounded-full" style="width: 0%"></div>
            </div>
            <div id="strength-tips" class="text-xs text-[#6f6f6f]">
                <!-- Dynamic tips -->
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-[#eae7e2] mb-4">
            <button onclick="switchTab('requests')" class="tab-btn active flex-1 py-3 text-sm font-medium border-b-2 border-[#c4511c] text-[#c4511c]" id="tab-requests">
                Requests (<span id="request-count">0</span>)
            </button>
            <button onclick="switchTab('profile')" class="tab-btn flex-1 py-3 text-sm font-medium text-[#6f6f6f]" id="tab-profile">
                Profile
            </button>
        </div>

        <!-- Requests Tab -->
        <div id="requests-tab" class="tab-content">
            <div id="requests-list" class="space-y-3">
                <!-- Loaded by JS -->
            </div>
        </div>

        <!-- Profile Tab -->
        <div id="profile-tab" class="tab-content hidden">
            <div id="profile-info" class="space-y-4">
                <!-- Loaded by JS -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (New) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#eae7e2] px-4 py-2 z-50">
        <div class="flex justify-around items-center">
            <a href="/roamblr-web/dashboard/local.html" class="flex flex-col items-center p-2 text-[#c4511c]">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs mt-1">Home</span>
            </a>
            <a href="/roamblr-web/directory.html" class="flex flex-col items-center p-2 text-[#6f6f6f]">
                <i class="fas fa-search text-xl"></i>
                <span class="text-xs mt-1">Browse</span>
            </a>
            <a href="/roamblr-web/dashboard/local.html?tab=profile" class="flex flex-col items-center p-2 text-[#6f6f6f]">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs mt-1">Profile</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { auth, db, logout, getCurrentUser, requireAuth } from '/roamblr-web/js/auth.js';
        import { collection, query, where, getDocs, doc, getDoc, updateDoc } from '/roamblr-web/js/firebase.js';

        requireAuth();

        // Global variables
        let currentRequests = [];
        let currentCreator = null;
        let userData = null;

        // Tab switching
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-[#c4511c]', 'text-[#c4511c]');
                btn.classList.add('text-[#6f6f6f]');
            });
            document.getElementById(`tab-${tabName}`).classList.add('border-[#c4511c]', 'text-[#c4511c]');
            
            // Update URL hash for bottom nav
            window.location.hash = tabName;
        };

        // Check URL hash on load
        if (window.location.hash === '#profile') {
            switchTab('profile');
        }

        // Share profile function
        window.shareProfile = () => {
            if (!auth.currentUser) return;
            const url = `${window.location.origin}/roamblr-web/creator.html?id=${auth.currentUser.uid}`;
            if (navigator.share) {
                navigator.share({
                    title: 'My roamblr Profile',
                    text: 'Check out my creator profile!',
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url);
                alert('Profile link copied to clipboard!');
            }
        };

        // Calculate profile strength
        function calculateProfileStrength(creator) {
            let score = 0;
            let total = 6;
            let missing = [];
            
            if (creator.name) score++;
            else missing.push('name');
            
            if (creator.bio && creator.bio.length > 20) score++;
            else missing.push('longer bio');
            
            if (creator.avatar && creator.avatar !== '👤') score++;
            else missing.push('profile photo');
            
            if (creator.niches && creator.niches.length > 0) score++;
            else missing.push('niches');
            
            if (creator.channelLink) score++;
            else missing.push('channel link');
            
            if (creator.instagram) score++;
            
            const percent = Math.round((score / total) * 100);
            return { percent, missing };
        }

        async function loadLocalData() {
            const user = await getCurrentUser();
            if (!user) return;

            try {
                // Get user data
                userData = (await getDoc(doc(db, "users", user.uid))).data();
                
                // Welcome message
                document.getElementById('welcome-name').textContent = userData?.name || 'Creator';
                
                // Member since
                if (userData?.createdAt) {
                    const date = new Date(userData.createdAt.seconds * 1000);
                    document.getElementById('member-since').textContent = `Member since ${date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}`;
                }

                // Check if creator profile exists
                const creatorDoc = await getDoc(doc(db, "creators", user.uid));
                
                if (!creatorDoc.exists()) {
                    window.location.href = '/roamblr-web/dashboard/local/setup.html';
                    return;
                }

                currentCreator = { id: user.uid, ...creatorDoc.data() };
                
                // Calculate and show profile strength
                const { percent, missing } = calculateProfileStrength(currentCreator);
                if (percent < 100) {
                    document.getElementById('strength-meter').classList.remove('hidden');
                    document.getElementById('strength-percent').textContent = percent + '%';
                    document.getElementById('strength-bar').style.width = percent + '%';
                    
                    if (missing.length > 0) {
                        document.getElementById('strength-tips').innerHTML = `
                            <i class="fas fa-lightbulb text-yellow-500 mr-1"></i>
                            Tips: Add ${missing.slice(0, 2).join(', ')} to boost your profile
                        `;
                    }
                }
                
                // Load requests
                const requestsQuery = query(
                    collection(db, "requests"),
                    where("creatorId", "==", user.uid)
                );
                const requestsSnapshot = await getDocs(requestsQuery);
                currentRequests = requestsSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // Update stats
                const pending = currentRequests.filter(r => r.status === 'pending').length;
                const accepted = currentRequests.filter(r => r.status === 'accepted').length;
                
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-accepted').textContent = accepted;
                document.getElementById('stat-total').textContent = currentRequests.length;
                document.getElementById('request-count').textContent = currentRequests.length;
                
                // Show pending timer if any
                if (pending > 0) {
                    document.getElementById('pending-timer').innerHTML = '⏳ Action needed';
                }
                
                // Show status banner
                const banner = document.getElementById('statusBanner');
                if (currentCreator.status === 'pending') {
                    banner.classList.remove('hidden');
                    banner.className = 'mb-4 p-4 rounded-xl bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm';
                    banner.innerHTML = '<i class="fas fa-clock mr-2"></i> Your profile is pending review. We\'ll notify you within 48 hours.';
                } else if (currentCreator.status === 'approved') {
                    banner.classList.remove('hidden');
                    banner.className = 'mb-4 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm';
                    banner.innerHTML = '<i class="fas fa-check-circle mr-2"></i> Your profile is live! <a href="/roamblr-web/creator.html?id=' + user.uid + '" class="underline ml-2">View</a>';
                }

                // Load requests list
                renderRequestsList();
                
                // Load profile info
                renderProfileInfo();

            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        function renderRequestsList() {
            const requestsList = document.getElementById('requests-list');
            
            if (currentRequests.length === 0) {
                requestsList.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border-2 border-dashed border-[#c4511c] text-center slide-up">
                        <div class="w-20 h-20 bg-[#c4511c] bg-opacity-10 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-handshake text-3xl text-[#c4511c]"></i>
                        </div>
                        <h3 class="text-lg font-bold mb-2">No requests yet</h3>
                        <p class="text-sm text-[#5a5a5a] mb-4">Travelers will contact you here when they want to collab</p>
                        <a href="/roamblr-web/directory.html" class="inline-block bg-[#c4511c] text-white px-6 py-3 rounded-full text-sm font-medium">
                            Browse Cities <i class="fas fa-arrow-right ml-2"></i>
                        </a>
                    </div>
                `;
                return;
            }

            requestsList.innerHTML = currentRequests.map((request, index) => {
                const statusColors = {
                    pending: 'bg-yellow-100 text-yellow-800',
                    accepted: 'bg-green-100 text-green-800',
                    rejected: 'bg-red-100 text-red-800',
                    completed: 'bg-blue-100 text-blue-800'
                };
                
                return `
                    <div class="bg-white p-4 rounded-xl border border-[#eeebe6] slide-up" style="animation-delay: ${index * 0.1}s">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold">${request.travelerName}</h3>
                            <span class="px-2 py-1 rounded-full text-xs font-medium ${statusColors[request.status]}">
                                ${request.status}
                            </span>
                        </div>
                        
                        <div class="flex items-center gap-2 text-xs text-[#6f6f6f] mb-2">
                            <i class="far fa-calendar"></i>
                            <span>${request.arrivalDate || '?'} → ${request.departureDate || '?'}</span>
                        </div>
                        
                        <p class="text-sm text-[#5a5a5a] mb-3">"${request.contentIdea || 'No details'}"</p>
                        
                        <!-- Status Timeline -->
                        <div class="relative pl-6 pb-2 mb-3 border-l-2 ${request.status === 'pending' ? 'border-yellow-400' : request.status === 'accepted' ? 'border-green-400' : 'border-gray-300'}">
                            <div class="absolute -left-2 top-0 w-4 h-4 ${request.status === 'pending' ? 'bg-yellow-400 animate-pulse' : request.status === 'accepted' ? 'bg-green-400' : 'bg-gray-300'} rounded-full"></div>
                            <p class="text-xs font-medium">
                                ${request.status === 'pending' ? 'Awaiting your response' : 
                                  request.status === 'accepted' ? 'You accepted this request' : 
                                  request.status === 'rejected' ? 'You declined' : 'Completed'}
                            </p>
                            <p class="text-xs text-[#6f6f6f]">
                                ${request.status === 'pending' ? 'Please respond within 48 hours' : 
                                  request.status === 'accepted' ? `Contact: ${request.travelerEmail || 'email not available'}` : ''}
                            </p>
                        </div>
                        
                        ${request.status === 'pending' ? `
                            <div class="flex gap-2 mt-3">
                                <button onclick="updateRequestStatus('${request.id}', 'accepted')" class="flex-1 bg-green-600 text-white py-3 rounded-full text-sm font-medium">
                                    Accept
                                </button>
                                <button onclick="updateRequestStatus('${request.id}', 'rejected')" class="flex-1 border border-red-600 text-red-600 py-3 rounded-full text-sm font-medium">
                                    Decline
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderProfileInfo() {
            document.getElementById('profile-info').innerHTML = `
                <div class="bg-white p-5 rounded-xl border border-[#eeebe6] slide-up">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-16 h-16 bg-[#e6ddd2] rounded-full flex items-center justify-center text-3xl">
                            ${currentCreator.avatar || '👤'}
                        </div>
                        <div>
                            <h3 class="font-bold text-lg">${currentCreator.name}</h3>
                            <p class="text-sm text-[#c4511c] flex items-center gap-1">
                                <i class="fas fa-map-pin text-xs"></i> ${currentCreator.city}
                            </p>
                        </div>
                    </div>
                    
                    <div class="space-y-3 text-sm">
                        <div class="bg-[#f9f6f2] p-3 rounded-lg">
                            <p class="text-[#5a5a5a]">${currentCreator.bio || 'No bio yet'}</p>
                        </div>
                        
                        <div class="flex flex-wrap gap-2">
                            ${currentCreator.niches?.map(n => 
                                `<span class="bg-[#f0ebe4] px-3 py-1 rounded-full text-xs">${n}</span>`
                            ).join('') || '<span class="text-[#6f6f6f] text-xs">No niches added</span>'}
                        </div>
                        
                        <div class="pt-3 space-y-2 border-t border-[#edebe7]">
                            <a href="${currentCreator.channelLink}" target="_blank" class="flex items-center gap-2 text-[#c4511c] text-sm">
                                <i class="fab fa-youtube"></i> YouTube Channel
                            </a>
                            ${currentCreator.instagram ? `
                                <a href="https://instagram.com/${currentCreator.instagram}" target="_blank" class="flex items-center gap-2 text-[#c4511c] text-sm">
                                    <i class="fab fa-instagram"></i> Instagram
                                </a>
                            ` : ''}
                            <a href="/roamblr-web/creator.html?id=${auth.currentUser?.uid}" class="flex items-center gap-2 text-[#c4511c] text-sm">
                                <i class="fas fa-user"></i> View Public Profile
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.updateRequestStatus = async (requestId, status) => {
            try {
                await updateDoc(doc(db, "requests", requestId), { status });
                
                // Update local state
                const requestIndex = currentRequests.findIndex(r => r.id === requestId);
                if (requestIndex !== -1) {
                    currentRequests[requestIndex].status = status;
                }
                
                // Re-render
                renderRequestsList();
                
                // Update stats
                const pending = currentRequests.filter(r => r.status === 'pending').length;
                const accepted = currentRequests.filter(r => r.status === 'accepted').length;
                
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-accepted').textContent = accepted;
                
                if (pending === 0) {
                    document.getElementById('pending-timer').innerHTML = '';
                }
                
            } catch (error) {
                console.error("Error updating request:", error);
                alert("Failed to update request. Please try again.");
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadLocalData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard · roamblr</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#fbfaf8] pb-24">

    <!-- Header -->
    <div class="bg-white border-b border-[#eae7e2] px-4 py-3 sticky top-0 z-10">
        <div class="flex items-center justify-between max-w-lg mx-auto">
            <a href="/roamblr-web/index.html" class="text-xl font-bold">
                roam<span class="text-[#c4511c]">blr</span> <span class="text-sm font-normal text-[#6f6f6f] ml-1">Admin</span>
            </a>
            <div class="flex items-center gap-3">
                <button onclick="refreshData()" class="text-[#6f6f6f] text-sm" title="Refresh">
                    <i class="fas fa-sync-alt"></i>
                </button>
                <button id="logoutBtn" class="border border-[#151515] text-[#151515] px-3 py-1.5 rounded-full text-xs">
                    Exit
                </button>
            </div>
        </div>
    </div>

    <div class="px-4 py-6 max-w-lg mx-auto">
        <!-- Welcome Header -->
        <div class="mb-6 slide-up">
            <h1 class="text-2xl font-bold">Admin Dashboard</h1>
            <p class="text-sm text-[#6f6f6f] mt-1">Manage creators and monitor platform</p>
        </div>

        <!-- Platform Stats Cards -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] shadow-sm">
                <div class="text-xs text-[#6f6f6f] mb-1">Total Creators</div>
                <div class="text-3xl font-bold text-[#c4511c]" id="stat-total">0</div>
                <div class="text-xs text-green-600 mt-1" id="stat-total-change"></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] shadow-sm">
                <div class="text-xs text-[#6f6f6f] mb-1">Pending Review</div>
                <div class="text-3xl font-bold text-yellow-600" id="stat-pending">0</div>
                <div class="text-xs text-[#6f6f6f] mt-1" id="stat-pending-desc"></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] shadow-sm">
                <div class="text-xs text-[#6f6f6f] mb-1">Approved</div>
                <div class="text-3xl font-bold text-green-600" id="stat-approved">0</div>
                <div class="text-xs text-[#6f6f6f] mt-1">Live on site</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-[#eeebe6] shadow-sm">
                <div class="text-xs text-[#6f6f6f] mb-1">Total Requests</div>
                <div class="text-3xl font-bold text-blue-600" id="stat-requests">0</div>
                <div class="text-xs text-[#6f6f6f] mt-1">All time</div>
            </div>
        </div>

        <!-- Data Repair Tool -->
        <div class="bg-white p-4 rounded-xl border border-[#eeebe6] mb-6">
            <button onclick="toggleRepairTool()" class="w-full flex justify-between items-center">
                <span class="font-semibold text-sm flex items-center gap-2">
                    <i class="fas fa-tools text-[#c4511c]"></i>
                    Data Repair Tool
                </span>
                <i class="fas fa-chevron-down text-[#6f6f6f]" id="repair-chevron"></i>
            </button>
            
            <div id="repair-tool" class="hidden mt-4 space-y-3">
                <p class="text-xs text-[#6f6f6f]">Fix creators that were approved but not showing up, or verify all data.</p>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="fixApprovedCreators()" class="bg-yellow-600 text-white py-2 rounded-full text-xs font-medium">
                        <i class="fas fa-sync-alt mr-1"></i> Fix Approved
                    </button>
                    <button onclick="verifyAllCreators()" class="bg-blue-600 text-white py-2 rounded-full text-xs font-medium">
                        <i class="fas fa-check-double mr-1"></i> Verify All
                    </button>
                </div>
                
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="reindexAllCreators()" class="bg-purple-600 text-white py-2 rounded-full text-xs font-medium">
                        <i class="fas fa-database mr-1"></i> Reindex All
                    </button>
                    <button onclick="fixMissingEmails()" class="bg-indigo-600 text-white py-2 rounded-full text-xs font-medium">
                        <i class="fas fa-envelope mr-1"></i> Fix Missing Emails
                    </button>
                </div>
                
                <div id="repair-results" class="text-xs mt-2 hidden"></div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="loadPending()" class="bg-[#c4511c] text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
                <i class="fas fa-clock mr-1"></i> Pending (<span id="pending-count">0</span>)
            </button>
            <button onclick="loadApproved()" class="bg-white border border-[#ddd8d0] px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
                <i class="fas fa-check-circle mr-1 text-green-600"></i> Approved
            </button>
            <button onclick="loadAll()" class="bg-white border border-[#ddd8d0] px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
                <i class="fas fa-users mr-1 text-[#c4511c]"></i> All
            </button>
            <button onclick="approveAllPending()" class="bg-green-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap">
                <i class="fas fa-check-double mr-1"></i> Approve All
            </button>
        </div>

        <!-- Success/Error Messages -->
        <div id="messageBox" class="mb-4 p-3 rounded-lg text-sm hidden"></div>

        <!-- Loading State -->
        <div id="loading-state" class="text-center py-8 hidden">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-[#c4511c] border-t-transparent"></div>
            <p class="text-sm text-[#6f6f6f] mt-2">Loading creators...</p>
        </div>

        <!-- Creators List -->
        <div id="creatorsList" class="space-y-3">
            <!-- Loaded by JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-[#eae7e2] px-4 py-2 z-50">
        <div class="flex justify-around items-center max-w-lg mx-auto">
            <a href="/roamblr-web/dashboard/admin.html" class="flex flex-col items-center p-2 text-[#c4511c]">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs mt-1">Home</span>
            </a>
            <a href="/roamblr-web/directory.html" class="flex flex-col items-center p-2 text-[#6f6f6f]">
                <i class="fas fa-search text-xl"></i>
                <span class="text-xs mt-1">Browse</span>
            </a>
            <button onclick="refreshData()" class="flex flex-col items-center p-2 text-[#6f6f6f]">
                <i class="fas fa-sync-alt text-xl"></i>
                <span class="text-xs mt-1">Refresh</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, where, updateDoc, doc, getDoc, writeBatch } from '/roamblr-web/js/firebase.js';
        import { logout, requireAuth } from '/roamblr-web/js/auth.js';

        // Global variables
        let currentFilter = 'pending';
        let allCreators = [];
        let allRequests = [];
        let allCities = [];

        // Verify admin access
        async function verifyAdmin() {
            const user = await (await import('/roamblr-web/js/auth.js')).getCurrentUser();
            if (!user) {
                window.location.href = '/roamblr-web/auth/login.html';
                return false;
            }
            
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== 'admin') {
                window.location.href = '/roamblr-web/index.html';
                return false;
            }
            return true;
        }

        await verifyAdmin();

        // Show message function
        function showMessage(text, type = 'success') {
            const box = document.getElementById('messageBox');
            box.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-yellow-100', 'text-yellow-800');
            
            if (type === 'success') {
                box.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                box.classList.add('bg-red-100', 'text-red-800');
            } else {
                box.classList.add('bg-yellow-100', 'text-yellow-800');
            }
            
            box.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} mr-2"></i>${text}`;
            
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        }

        // Load all data
        async function loadAllData() {
            document.getElementById('loading-state').classList.remove('hidden');
            
            try {
                // Load cities first
                const citiesSnapshot = await getDocs(collection(db, "cities"));
                allCities = citiesSnapshot.docs.map(doc => doc.id);
                
                // Load creators
                const creatorsSnapshot = await getDocs(collection(db, "creators"));
                allCreators = creatorsSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // Load requests
                const requestsSnapshot = await getDocs(collection(db, "requests"));
                allRequests = requestsSnapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // Update stats
                const total = allCreators.length;
                const pending = allCreators.filter(c => c.status === 'pending').length;
                const approved = allCreators.filter(c => c.status === 'approved').length;
                const requests = allRequests.length;
                
                document.getElementById('stat-total').textContent = total;
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-approved').textContent = approved;
                document.getElementById('stat-requests').textContent = requests;
                document.getElementById('pending-count').textContent = pending;
                
                // Calculate change (compare with last month - mock for now)
                const lastMonth = allCreators.filter(c => {
                    if (!c.createdAt) return false;
                    const date = new Date(c.createdAt.seconds * 1000);
                    const monthAgo = new Date();
                    monthAgo.setMonth(monthAgo.getMonth() - 1);
                    return date > monthAgo;
                }).length;
                
                const growth = total > 0 ? Math.round((lastMonth / total) * 100) : 0;
                document.getElementById('stat-total-change').innerHTML = `⬆️ +${growth}% this month`;
                document.getElementById('stat-pending-desc').innerHTML = pending + ' need review';
                
                // Load current filter
                if (currentFilter === 'pending') loadPending();
                else if (currentFilter === 'approved') loadApproved();
                else loadAll();
                
            } catch (error) {
                console.error("Error loading data:", error);
                showMessage('Failed to load data', 'error');
            } finally {
                document.getElementById('loading-state').classList.add('hidden');
            }
        }

        // Filter functions
        window.loadPending = () => {
            currentFilter = 'pending';
            const filtered = allCreators.filter(c => c.status === 'pending');
            renderCreators(filtered, 'pending');
        };

        window.loadApproved = () => {
            currentFilter = 'approved';
            const filtered = allCreators.filter(c => c.status === 'approved');
            renderCreators(filtered, 'approved');
        };

        window.loadAll = () => {
            currentFilter = 'all';
            renderCreators(allCreators, 'all');
        };

        // Refresh data
        window.refreshData = () => {
            loadAllData();
            showMessage('Data refreshed', 'success');
        };

        // Approve creator
        window.approveCreator = async (id, email) => {
            if (!confirm(`Approve this creator? They will appear live on the site.`)) return;
            
            try {
                await updateDoc(doc(db, "creators", id), { 
                    status: "approved",
                    approvedAt: new Date().toISOString()
                });
                
                // Update local data
                const index = allCreators.findIndex(c => c.id === id);
                if (index !== -1) {
                    allCreators[index].status = 'approved';
                }
                
                showMessage(`✅ Creator approved! They are now live.`, 'success');
                
                // Reload current filter
                if (currentFilter === 'pending') loadPending();
                else if (currentFilter === 'approved') loadApproved();
                else loadAll();
                
            } catch (error) {
                console.error("Error approving creator:", error);
                showMessage('Failed to approve. Check console.', 'error');
            }
        };

        // Reject creator
        window.rejectCreator = async (id) => {
            if (!confirm(`Reject this creator? They will not be able to appear on the site.`)) return;
            
            try {
                await updateDoc(doc(db, "creators", id), { status: "rejected" });
                
                const index = allCreators.findIndex(c => c.id === id);
                if (index !== -1) {
                    allCreators[index].status = 'rejected';
                }
                
                showMessage('Creator rejected', 'warning');
                
                if (currentFilter === 'pending') loadPending();
                else if (currentFilter === 'approved') loadApproved();
                else loadAll();
                
            } catch (error) {
                console.error("Error rejecting creator:", error);
                showMessage('Failed to reject', 'error');
            }
        };

        // Approve all pending
        window.approveAllPending = async () => {
            const pending = allCreators.filter(c => c.status === 'pending');
            if (pending.length === 0) {
                showMessage('No pending creators', 'warning');
                return;
            }
            
            if (!confirm(`Approve all ${pending.length} pending creators?`)) return;
            
            try {
                const batch = writeBatch(db);
                pending.forEach(c => {
                    const ref = doc(db, "creators", c.id);
                    batch.update(ref, { 
                        status: "approved",
                        approvedAt: new Date().toISOString()
                    });
                });
                await batch.commit();
                
                showMessage(`✅ Approved ${pending.length} creators`, 'success');
                loadAllData();
                
            } catch (error) {
                console.error("Error in batch approve:", error);
                showMessage('Failed to approve all', 'error');
            }
        };

        // Delete creator
        window.deleteCreator = async (id) => {
            if (!confirm(`⚠️ Permanently delete this creator? This cannot be undone.`)) return;
            
            try {
                await updateDoc(doc(db, "creators", id), { status: "deleted" });
                
                const index = allCreators.findIndex(c => c.id === id);
                if (index !== -1) {
                    allCreators[index].status = 'deleted';
                }
                
                showMessage('Creator deleted', 'warning');
                loadAllData();
                
            } catch (error) {
                console.error("Error deleting creator:", error);
                showMessage('Failed to delete', 'error');
            }
        };

        // Toggle repair tool
        window.toggleRepairTool = () => {
            const tool = document.getElementById('repair-tool');
            const chevron = document.getElementById('repair-chevron');
            tool.classList.toggle('hidden');
            chevron.classList.toggle('fa-chevron-down');
            chevron.classList.toggle('fa-chevron-up');
        };

        // Fix approved creators
        window.fixApprovedCreators = async () => {
            const results = document.getElementById('repair-results');
            results.classList.remove('hidden');
            results.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Checking creators...';
            
            try {
                const q = query(collection(db, "creators"), where("status", "==", "approved"));
                const snapshot = await getDocs(q);
                
                let fixed = 0;
                let alreadyGood = 0;
                
                for (const doc of snapshot.docs) {
                    const creator = doc.data();
                    let needsFix = false;
                    const updates = {};
                    
                    // Fix missing city
                    if (!creator.city || !allCities.includes(creator.city)) {
                        updates.city = 'nairobi'; // Default fallback
                        needsFix = true;
                    }
                    
                    // Fix missing niches
                    if (!creator.niches || creator.niches.length === 0) {
                        updates.niches = ['travel', 'culture'];
                        needsFix = true;
                    }
                    
                    // Fix missing bio
                    if (!creator.bio || creator.bio.length < 10) {
                        updates.bio = creator.bio || 'Local creator excited to collaborate!';
                        needsFix = true;
                    }
                    
                    // Ensure status is explicitly approved
                    updates.status = "approved";
                    updates.lastVerified = new Date().toISOString();
                    
                    if (needsFix) {
                        await updateDoc(doc.ref, updates);
                        fixed++;
                    } else {
                        await updateDoc(doc.ref, { lastVerified: new Date().toISOString() });
                        alreadyGood++;
                    }
                }
                
                results.innerHTML = `
                    <div class="bg-green-100 text-green-800 p-3 rounded">
                        <i class="fas fa-check-circle mr-1"></i> 
                        Fixed: ${fixed} creators | Already good: ${alreadyGood}
                    </div>
                `;
                
                loadAllData();
                
            } catch (error) {
                console.error("Error fixing creators:", error);
                results.innerHTML = `
                    <div class="bg-red-100 text-red-800 p-3 rounded">
                        <i class="fas fa-exclamation-circle mr-1"></i> 
                        Error: ${error.message}
                    </div>
                `;
            }
        };

        // Verify all creators
        window.verifyAllCreators = async () => {
            const results = document.getElementById('repair-results');
            results.classList.remove('hidden');
            results.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Verifying creators...';
            
            try {
                const creatorsSnapshot = await getDocs(collection(db, "creators"));
                let issues = [];
                let good = 0;
                
                for (const doc of creatorsSnapshot.docs) {
                    const creator = doc.data();
                    
                    // Check if city exists
                    if (creator.city && !allCities.includes(creator.city)) {
                        issues.push(`${creator.name || 'Unknown'}: city "${creator.city}" doesn't exist`);
                    }
                    
                    // Check approved but missing required fields
                    if (creator.status === 'approved') {
                        if (!creator.niches || creator.niches.length === 0) {
                            issues.push(`${creator.name || 'Unknown'}: approved but no niches`);
                        }
                        if (!creator.bio || creator.bio.length < 10) {
                            issues.push(`${creator.name || 'Unknown'}: approved but bio too short`);
                        }
                        if (!creator.channelLink) {
                            issues.push(`${creator.name || 'Unknown'}: approved but no channel link`);
                        }
                        good++;
                    }
                }
                
                if (issues.length === 0) {
                    results.innerHTML = `
                        <div class="bg-green-100 text-green-800 p-3 rounded">
                            <i class="fas fa-check-circle mr-1"></i> 
                            All ${good} approved creators look good!
                        </div>
                    `;
                } else {
                    results.innerHTML = `
                        <div class="bg-yellow-100 text-yellow-800 p-3 rounded">
                            <p class="font-semibold mb-2">⚠️ Found ${issues.length} issues:</p>
                            <ul class="list-disc pl-4 text-xs space-y-1 max-h-40 overflow-y-auto">
                                ${issues.slice(0, 10).map(i => `<li>${i}</li>`).join('')}
                                ${issues.length > 10 ? `<li>...and ${issues.length - 10} more</li>` : ''}
                            </ul>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error("Error verifying:", error);
                results.innerHTML = `
                    <div class="bg-red-100 text-red-800 p-3 rounded">
                        <i class="fas fa-exclamation-circle mr-1"></i> 
                        Error: ${error.message}
                    </div>
                `;
            }
        };

        // Reindex all creators
        window.reindexAllCreators = async () => {
            const results = document.getElementById('repair-results');
            results.classList.remove('hidden');
            results.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Reindexing all creators...';
            
            try {
                const snapshot = await getDocs(collection(db, "creators"));
                let updated = 0;
                
                for (const doc of snapshot.docs) {
                    await updateDoc(doc.ref, {
                        lastIndexed: new Date().toISOString(),
                        searchableName: (doc.data().name || '').toLowerCase(),
                        searchableCity: (doc.data().city || '').toLowerCase()
                    });
                    updated++;
                }
                
                results.innerHTML = `
                    <div class="bg-green-100 text-green-800 p-3 rounded">
                        <i class="fas fa-check-circle mr-1"></i> 
                        Reindexed ${updated} creators
                    </div>
                `;
                
            } catch (error) {
                console.error("Error reindexing:", error);
                results.innerHTML = `
                    <div class="bg-red-100 text-red-800 p-3 rounded">
                        <i class="fas fa-exclamation-circle mr-1"></i> 
                        Error: ${error.message}
                    </div>
                `;
            }
        };

        // Fix missing emails
        window.fixMissingEmails = async () => {
            const results = document.getElementById('repair-results');
            results.classList.remove('hidden');
            results.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Fixing missing emails...';
            
            try {
                const creatorsSnapshot = await getDocs(collection(db, "creators"));
                let fixed = 0;
                
                for (const doc of creatorsSnapshot.docs) {
                    const creator = doc.data();
                    if (!creator.email) {
                        // Try to get from users collection
                        const userDoc = await getDoc(doc(db, "users", doc.id));
                        if (userDoc.exists()) {
                            await updateDoc(doc.ref, { 
                                email: userDoc.data().email,
                                name: userDoc.data().name || creator.name
                            });
                            fixed++;
                        }
                    }
                }
                
                results.innerHTML = `
                    <div class="bg-green-100 text-green-800 p-3 rounded">
                        <i class="fas fa-check-circle mr-1"></i> 
                        Fixed ${fixed} creators with missing emails
                    </div>
                `;
                
                loadAllData();
                
            } catch (error) {
                console.error("Error fixing emails:", error);
                results.innerHTML = `
                    <div class="bg-red-100 text-red-800 p-3 rounded">
                        <i class="fas fa-exclamation-circle mr-1"></i> 
                        Error: ${error.message}
                    </div>
                `;
            }
        };

        // Render creators
        function renderCreators(creators, filterType) {
            const container = document.getElementById('creatorsList');
            
            if (creators.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border-2 border-dashed border-[#c4511c] text-center slide-up">
                        <div class="w-16 h-16 bg-[#c4511c] bg-opacity-10 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i class="fas fa-users text-2xl text-[#c4511c]"></i>
                        </div>
                        <p class="text-[#5a5a5a] text-sm">No ${filterType} creators found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = creators.map((creator, index) => {
                const requestCount = allRequests.filter(r => r.creatorId === creator.id).length;
                const joinDate = creator.createdAt ? new Date(creator.createdAt.seconds * 1000).toLocaleDateString() : 'Unknown';
                const cityExists = allCities.includes(creator.city);
                
                return `
                    <div class="bg-white p-4 rounded-xl border border-[#eeebe6] slide-up ${!cityExists && creator.status === 'approved' ? 'border-yellow-400 border-2' : ''}" style="animation-delay: ${index * 0.05}s">
                        <div class="flex items-start gap-3 mb-3">
                            <div class="w-12 h-12 bg-[#e6ddd2] rounded-full flex items-center justify-center text-xl flex-shrink-0">
                                ${creator.avatar || '👤'}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-semibold truncate">${creator.name || 'Unnamed'}</h3>
                                    <span class="px-2 py-1 rounded-full text-xs font-medium whitespace-nowrap ml-2
                                        ${creator.status === 'pending' ? 'bg-yellow-100 text-yellow-800' : ''}
                                        ${creator.status === 'approved' ? 'bg-green-100 text-green-800' : ''}
                                        ${creator.status === 'rejected' ? 'bg-red-100 text-red-800' : ''}
                                        ${creator.status === 'deleted' ? 'bg-gray-100 text-gray-800' : ''}">
                                        ${creator.status || 'unknown'}
                                    </span>
                                </div>
                                <p class="text-xs text-[#c4511c] truncate">
                                    ${creator.city || 'No city'} · ${creator.subs || '0'} subs
                                    ${!cityExists && creator.status === 'approved' ? ' ⚠️ City missing' : ''}
                                </p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 text-xs text-center mb-3">
                            <div class="bg-[#f9f6f2] p-2 rounded">
                                <div class="font-semibold">${requestCount}</div>
                                <div class="text-[#6f6f6f]">requests</div>
                            </div>
                            <div class="bg-[#f9f6f2] p-2 rounded">
                                <div class="font-semibold">${creator.hosted || 0}</div>
                                <div class="text-[#6f6f6f]">collabs</div>
                            </div>
                            <div class="bg-[#f9f6f2] p-2 rounded">
                                <div class="font-semibold">${creator.niches?.length || 0}</div>
                                <div class="text-[#6f6f6f]">niches</div>
                            </div>
                        </div>
                        
                        <div class="text-xs text-[#6f6f6f] mb-3 flex flex-wrap gap-2">
                            <span><i class="far fa-calendar mr-1"></i> ${joinDate}</span>
                            ${creator.email ? '<span><i class="far fa-envelope mr-1"></i> Has email</span>' : ''}
                        </div>
                        
                        <div class="flex gap-2">
                            ${creator.status === 'pending' ? `
                                <button onclick="approveCreator('${creator.id}')" class="flex-1 bg-green-600 text-white py-2 rounded-full text-xs font-medium">
                                    ✓ Approve
                                </button>
                                <button onclick="rejectCreator('${creator.id}')" class="flex-1 border border-red-600 text-red-600 py-2 rounded-full text-xs font-medium">
                                    ✕ Reject
                                </button>
                            ` : ''}
                            
                            ${creator.status === 'approved' ? `
                                <button onclick="window.open('/roamblr-web/creator.html?id=${creator.id}', '_blank')" class="flex-1 bg-[#c4511c] text-white py-2 rounded-full text-xs font-medium">
                                    <i class="fas fa-eye mr-1"></i> View
                                </button>
                                <button onclick="rejectCreator('${creator.id}')" class="flex-1 border border-red-600 text-red-600 py-2 rounded-full text-xs font-medium">
                                    Hide
                                </button>
                            ` : ''}
                            
                            ${creator.status === 'rejected' ? `
                                <button onclick="approveCreator('${creator.id}')" class="flex-1 bg-green-600 text-white py-2 rounded-full text-xs font-medium">
                                    Restore
                                </button>
                            ` : ''}
                            
                            ${creator.status === 'deleted' ? `
                                <button onclick="approveCreator('${creator.id}')" class="flex-1 bg-green-600 text-white py-2 rounded-full text-xs font-medium">
                                    Restore
                                </button>
                            ` : ''}
                            
                            <button onclick="deleteCreator('${creator.id}')" class="w-8 h-8 border border-red-600 text-red-600 rounded-full flex items-center justify-center" title="Delete">
                                <i class="fas fa-trash-alt text-xs"></i>
                            </button>
                        </div>
                        
                        ${creator.bio ? `
                            <div class="mt-3 text-xs text-[#5a5a5a] bg-[#f9f6f2] p-2 rounded">
                                "${creator.bio.substring(0, 80)}${creator.bio.length > 80 ? '...' : ''}"
                            </div>
                        ` : ''}
                        
                        ${!cityExists && creator.status === 'approved' ? `
                            <div class="mt-2 text-xs text-yellow-600">
                                <i class="fas fa-exclamation-triangle mr-1"></i>
                                City "${creator.city}" doesn't exist. Edit profile to fix.
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Initial load
        loadAllData();
    </script>
</body>
</html>
